{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Single-page quiz application powered by Django API">
  <title>Quiz App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'quiz/styles.css' %}">
</head>
<body>
  <main class="app-shell" aria-live="polite">
    <section class="hero" aria-label="Quiz application">
      <div class="brand-mark" aria-hidden="true">Q</div>
      <div>
        <p class="eyebrow">Knowledge check</p>
        <h1>Quiz App</h1>
        <p class="hero-copy">Choose your settings, answer the questions, and see your result instantly.</p>
      </div>
    </section>

    <section id="startScreen" class="screen card">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Step 1</p>
          <h2>Set up your quiz</h2>
        </div>
        <span class="pill">Saved automatically</span>
      </div>

      <form id="settingsForm" class="settings-grid">
        <label class="field">
          <span>Number of questions</span>
          <select id="amount" name="amount">
            <option value="5">5 questions</option>
            <option value="10">10 questions</option>
          </select>
        </label>

        <label class="field">
          <span>Difficulty</span>
          <select id="difficulty" name="difficulty">
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
          </select>
        </label>

        <label class="field field-wide">
          <span>Category <small>(optional)</small></span>
          <select id="category" name="category">
            <option value="">All categories</option>
          </select>
        </label>

        <button id="startButton" class="button primary field-wide" type="submit">
          <span class="button-label">Start quiz</span>
          <span class="button-spinner" aria-hidden="true"></span>
        </button>
      </form>

      <p id="startMessage" class="message" role="status"></p>
    </section>

    <section id="loadingScreen" class="screen card hidden" aria-label="Loading questions">
      <div class="skeleton-line skeleton-title"></div>
      <div class="skeleton-line skeleton-text"></div>
      <div class="skeleton-line skeleton-text short"></div>
      <div class="skeleton-options">
        <div class="skeleton-option"></div>
        <div class="skeleton-option"></div>
        <div class="skeleton-option"></div>
        <div class="skeleton-option"></div>
      </div>
    </section>

    <section id="quizScreen" class="screen card hidden">
      <div class="quiz-topbar">
        <div>
          <p id="questionCounter" class="eyebrow">Question 1 of 5</p>
          <p id="categoryLabel" class="category-label">General Knowledge</p>
        </div>
        <div class="topbar-stats">
          <div class="stat">
            <span>Score</span>
            <strong id="scoreValue">0</strong>
          </div>
          <div class="stat timer-stat">
            <span>Time</span>
            <strong><span id="timerValue">15</span>s</strong>
          </div>
        </div>
      </div>

      <div class="progress-track" aria-hidden="true">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <div class="question-wrap">
        <h2 id="questionText" class="question-text"></h2>
        <div id="answers" class="answers" role="group" aria-label="Answer choices"></div>
        <p id="feedback" class="feedback" role="status"></p>
      </div>

      <div class="quiz-actions">
        <button id="nextButton" class="button primary" type="button" disabled>Next question</button>
      </div>
    </section>

    <section id="resultScreen" class="screen card hidden">
      <div class="result-summary">
        <div id="resultRing" class="score-ring" aria-hidden="true">
          <div>
            <strong id="finalPercent">0%</strong>
            <span>result</span>
          </div>
        </div>
        <div>
          <p class="eyebrow">Completed</p>
          <h2>Your result</h2>
          <p id="finalScore" class="final-score"></p>
        </div>
      </div>

      <div class="review-header">
        <h3>Answer review</h3>
        <span id="reviewCount" class="pill"></span>
      </div>
      <ol id="reviewList" class="review-list"></ol>

      <button id="restartButton" class="button primary" type="button">Start again</button>
    </section>
  </main>

  <script src="{% static 'quiz/app.js' %}" defer></script>
</body>
</html>
